[project]
name = "mazegen"
version = "0.1.0"
description = "Reusable maze generator with seeded, perfect and braided modes."
requires-python = ">=3.10"
dependencies = []

[tool.poetry.group.dev.dependencies]
flake8 = "*"
mypy = "*"
build = "*"
pytest = "*"

[tool.poetry.group.display.dependencies]
mlx = { path = "vendor/mlx-2.2-py3-none-any.whl", markers = "sys_platform == 'linux'" }

[tool.mypy]
exclude = '^(\.?venv|build|dist|.*\.egg-info)/'

[[tool.mypy.overrides]]
module = ["mlx", "mlx.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"